#compose.yaml

#add extensão container tools

services:
  web:
    build: . # não vai se basear em algo já criado anteriormente
    ports:
      - "5000:5000"  # a porta de acesso e a porta do container
    volumes:
      - ./app:/app # para onde a informação será direcionada
    depends_on:
      - database
    environment:
      PYTHONUNBUFFERED: 1
      FLASK_ENV: development # cria uma variável de ambiente
  database:
    image: redis:alpine

  nginx:  # serve para controlar mais de uma página aberta e distribuir corretamente ???
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf #host:container
    depends_on:
      - web
    ports:
      - "4000:4000"  # a porta de acesso e a porta do container
